# Application images plus Postgres and Redis.
# Local development keeps using docker-compose.yml for the data services only.

name: netskope-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netskope
      POSTGRES_PASSWORD: netskope
      POSTGRES_DB: netskope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netskope -d netskope"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://netskope:netskope@postgres:5432/netskope?schema=public
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET to at least 32 characters}
      WEB_ORIGIN: http://localhost:3010
      API_HOST: 0.0.0.0
      API_PORT: 3011
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    shm_size: 1gb
    environment:
      DATABASE_URL: postgresql://netskope:netskope@postgres:5432/netskope?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://localhost:3011
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      API_URL: http://localhost:3011

volumes:
  postgres_data:
  redis_data:
